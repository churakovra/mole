name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/evaluate.py --output "${{ runner.temp }}/mole-evaluation.json"
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/mole-evaluation.json
  browser:
    runs-on: ubuntu-latest
    env:
      MOLE_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test -x "$MOLE_BROWSER_EXECUTABLE"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/evaluate.py --output /tmp/mole-evaluation.json
